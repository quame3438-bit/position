<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>展示牌安装位置</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#18202b;--muted:#667085;--line:#e4e7ec;--blue:#1677ff;--danger:#e5484d}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:760px;margin:auto;padding:12px 12px 40px}.top{font-size:22px;font-weight:800;margin:8px 4px 14px}.section{background:var(--card);border-radius:16px;margin:10px 0;box-shadow:0 2px 12px #0000000a;overflow:hidden}.head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;font-weight:750;cursor:pointer}.tri{transition:.2s}.section.closed .tri{transform:rotate(-90deg)}.body{padding:0 14px 14px}.section.closed .body{display:none}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.btn{border:0;border-radius:10px;padding:10px 12px;background:#eef4ff;color:#1456b8;font-weight:650}.primary{background:var(--blue);color:#fff}.danger{background:#fff0f0;color:var(--danger)}.small{flex:0 0 auto;padding:9px 10px}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:7px}.place{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.placeTitle{display:flex;align-items:center;gap:8px}.num{width:30px;height:30px;border-radius:9px;background:#f0f4fa;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}.name{font-weight:750;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.actions button{flex:1;min-width:64px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.photo{position:relative;aspect-ratio:1;background:#eee;border-radius:10px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:4px;top:4px;width:26px;height:26px;border:0;border-radius:50%;background:#0009;color:#fff}.status{padding:10px;border-radius:10px;background:#f6f8fb;margin-top:8px;font-size:13px}.hidden{display:none!important}.fontCtl{display:flex;align-items:center;gap:8px;margin-bottom:8px}.fontCtl button{flex:none}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:white;width:100%;max-width:760px;margin:auto;border-radius:18px 18px 0 0;padding:16px;max-height:90vh;overflow:auto}.sheet h3{margin:0 0 12px}.maplinks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.placeSelect{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;font:inherit;font-weight:650}.displayCard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}.displayCard h3{margin:0 0 12px;font-size:20px}.displayLabel{font-size:13px;color:var(--muted);margin:14px 0 6px}.displayPhotos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.displayPhotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;background:#eee}.noteDisplay{white-space:pre-wrap;line-height:1.65}.addPhotoBtn{display:block;width:100%;text-align:center;border:0;border-radius:10px;padding:11px 12px;background:#eef4ff;color:#1456b8;font-weight:650;cursor:pointer}@media(min-width:600px){.photos{grid-template-columns:repeat(5,1fr)}.modal{align-items:center}.sheet{border-radius:18px}}
</style></head><body><div class="wrap"><div class="top">展示牌安装位置</div>
<section class="section" id="cloudSec"><div class="head" onclick="toggleSec(this)"><span>1 云账号</span><span class="tri">▼</span></div><div class="body"><div id="loginBox"><input id="cloudEmail" type="email" placeholder="邮箱"><div style="height:8px"></div><input id="cloudPass" type="password" placeholder="密码"><div class="row" style="margin-top:8px"><button class="btn primary" onclick="cloudLogin()">登录</button><button class="btn" onclick="cloudRegister()">注册</button></div><div class="hint">云端自动同步地点、经纬度、备注、固定序号和排列顺序；照片只保存在本机和完整备份中，不上传云端。</div></div><div id="loggedBox" class="hidden"><div class="status">已登录：<b id="who"></b><br><span id="syncText">等待同步</span></div><button class="btn danger" style="margin-top:8px;width:100%" onclick="logout()">退出登录</button></div></div></section>
<section class="section"><div class="head" onclick="toggleSec(this)"><span>2 地点编辑信息</span><span class="tri">▼</span></div><div class="body"><select id="placeSelect" class="placeSelect" onchange="selectPlace(this.value)"></select><button class="btn primary" style="width:100%;margin-top:10px" onclick="openEditor()">＋ 新增地点</button><div id="selectedActions" class="actions"></div></div></section>
<section class="section"><div class="head" onclick="toggleSec(this)"><span>3 地点信息</span><span class="tri">▼</span></div><div class="body"><div id="placeDisplay"></div></div></section>
<section class="section"><div class="head" onclick="toggleSec(this)"><span>4 导入备份 / 导出备份</span><span class="tri">▼</span></div><div class="body"><div class="row"><button class="btn" onclick="document.getElementById('backupIn').click()">导入备份</button><button class="btn primary" onclick="exportBackup()">导出备份</button></div><input id="backupIn" class="hidden" type="file" accept="application/json,.json" onchange="importBackup(event)"><div class="hint">完整备份包含全部地点、经纬度、备注、顺序和照片。照片会转成数据保存在 JSON 备份文件中。</div></div></section></div>
<div class="modal" id="modal"><div class="sheet"><h3 id="editTitle">新增地点</h3><input id="pname" placeholder="地点名称，例如：义勒力特镇××嘎查"><div style="height:10px"></div><label class="addPhotoBtn" for="photosInput">＋ 添加图片</label><input id="photosInput" class="hidden" type="file" accept="image/*" multiple onchange="addPhotos(event)"><div class="hint">点击“添加图片”，可从手机照片图库选择；支持的浏览器也可调用相机拍照。</div><div id="editPhotos" class="photos"></div><div style="height:10px"></div><textarea id="pnote" placeholder="备注信息"></textarea><div style="height:14px"></div><div class="hint"><b>经纬度 / 地图选址</b></div><div class="row" style="margin-top:6px"><input id="plat" inputmode="decimal" placeholder="纬度"><input id="plng" inputmode="decimal" placeholder="经度"></div><div class="row" style="margin-top:8px"><button class="btn" onclick="getLocation()">📍 获取当前位置</button><button class="btn" onclick="shareCurrent()">分享位置</button></div><div class="maplinks"><button class="btn" onclick="openApple()">苹果地图</button><button class="btn" onclick="openBaidu()">百度地图</button></div><div class="row" style="margin-top:14px"><button class="btn" onclick="closeEditor()">取消</button><button class="btn primary" onclick="savePlace()">保存</button></div></div></div>
<script>
// ===== 云同步配置（Supabase） =====
const SUPABASE_URL='https://kbufgbyvwdavymrtprtp.supabase.co'; const SUPABASE_ANON_KEY='sb_publishable_f3sJdXME-_QIqNi-hm_PFw_Db00j0XX';
const K='sign_locations_v1', KF='sign_note_font_v1';let data=JSON.parse(localStorage.getItem(K)||'[]'), editId=null, tempPhotos=[];let noteFont=+(localStorage.getItem(KF)||16);let session=null;let selectedId=localStorage.getItem('sign_selected_place')||null;
const $=id=>document.getElementById(id);
const pname=$('pname'), plat=$('plat'), plng=$('plng'), pnote=$('pnote'),
      modal=$('modal'), editPhotos=$('editPhotos'), fontVal=$('fontVal'),
      syncText=$('syncText');

function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2)}function saveLocal(){localStorage.setItem(K,JSON.stringify(data));render();queueCloud()}function toggleSec(h){h.parentElement.classList.toggle('closed')}function esc(s=''){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){document.getElementById('fontVal')&&(document.getElementById('fontVal').textContent=noteFont);if(data.length&&!data.some(p=>p.id===selectedId))selectedId=data[0].id;if(!data.length)selectedId=null;if(selectedId)localStorage.setItem('sign_selected_place',selectedId);else localStorage.removeItem('sign_selected_place');let sel=$('placeSelect');if(sel){sel.innerHTML=data.length?data.map(p=>`<option value="${p.id}" ${p.id===selectedId?'selected':''}>${p.no}. ${esc(p.name||'未命名地点')}</option>`).join(''):'<option value="">还没有地点</option>';sel.disabled=!data.length}let p=data.find(x=>x.id===selectedId),act=$('selectedActions');if(act)act.innerHTML=p?`<button class="btn" onclick="openEditor('${p.id}')">编辑</button><button class="btn" onclick="move('${p.id}',-1)">上移</button><button class="btn" onclick="move('${p.id}',1)">下移</button><button class="btn danger" onclick="delPlace('${p.id}')">删除</button>`:'';let box=$('placeDisplay');if(box){if(!p)box.innerHTML='<div class="hint">请先在“地点编辑信息”中新增地点。</div>';else{let imgs=(p.photos||[]).length?`<div class="displayPhotos">${p.photos.map(x=>`<img src="${x}" alt="">`).join('')}</div>`:'<div class="hint">暂无图片</div>';let nav=(p.lat&&p.lng)?`<div class="row"><button class="btn primary" onclick="navPlace('${p.id}','apple')">苹果地图导航</button><button class="btn" onclick="navPlace('${p.id}','baidu')">百度地图导航</button></div>`:'<div class="hint">尚未设置经纬度，暂无导航链接。</div>';box.innerHTML=`<div class="displayCard"><h3>${esc(p.name||'未命名地点')}</h3><div class="displayLabel">图片</div>${imgs}<div class="displayLabel">备注信息</div><div class="noteDisplay" style="font-size:${noteFont}px">${esc(p.note||'暂无备注')}</div><div class="displayLabel">导航链接</div>${nav}</div>`}}}
function selectPlace(id){selectedId=id||null;render()}
function openEditor(id=null){editId=id;let p=id?data.find(x=>x.id===id):null;document.getElementById('editTitle').textContent=p?'编辑地点':'新增地点';pname.value=p?.name||'';plat.value=p?.lat||'';plng.value=p?.lng||'';pnote.value=p?.note||'';pnote.style.fontSize=noteFont+'px';tempPhotos=[...(p?.photos||[])];renderEditPhotos();modal.classList.add('show')}function closeEditor(){modal.classList.remove('show');editId=null;tempPhotos=[]}function renderEditPhotos(){editPhotos.innerHTML=tempPhotos.map((x,i)=>`<div class="photo"><img src="${x}"><button onclick="tempPhotos.splice(${i},1);renderEditPhotos()">×</button></div>`).join('')}
function savePlace(){
  try{
    let name=$('pname').value.trim();
    if(!name)return alert('请填写地点名称');
    const item={name,lat:$('plat').value.trim(),lng:$('plng').value.trim(),note:$('pnote').value,photos:[...tempPhotos]};
    if(editId){
      let p=data.find(x=>x.id===editId);
      if(!p)throw new Error('没有找到要编辑的地点');
      Object.assign(p,item);selectedId=p.id;
    }else{
      let maxNo=data.reduce((m,p)=>Math.max(m,Number(p.no)||0),0);
      const newItem={id:uid(),no:maxNo+1,...item};data.push(newItem);selectedId=newItem.id;
    }
    localStorage.setItem(K,JSON.stringify(data));
    closeEditor();
    render();
    queueCloud();
  }catch(e){
    alert('保存失败：'+(e?.message||e));
  }
}function delPlace(id){if(confirm('确定删除这个地点吗？固定序号不会重新编号。')){data=data.filter(x=>x.id!==id);if(selectedId===id)selectedId=data[0]?.id||null;saveLocal()}}function move(id,d){let i=data.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=data.length)return;[data[i],data[j]]=[data[j],data[i]];saveLocal()}
function getLocation(){if(!navigator.geolocation)return alert('当前浏览器不支持定位');navigator.geolocation.getCurrentPosition(p=>{plat.value=p.coords.latitude.toFixed(6);plng.value=p.coords.longitude.toFixed(6)},e=>alert('定位失败：请允许浏览器访问位置。'+e.message),{enableHighAccuracy:true,timeout:15000})}
function locText(name,lat,lng,note=''){return `${name}\n位置：${lat},${lng}${note?'\n备注：'+note:''}`};async function shareCurrent(){let t=locText(pname.value||'展示牌位置',plat.value,plng.value,pnote.value);await share(t,plat.value,plng.value)}async function sharePlace(id){let p=data.find(x=>x.id===id);await share(locText(p.name,p.lat,p.lng,p.note),p.lat,p.lng)}async function share(t,lat,lng){let url=lat&&lng?`https://maps.apple.com/?ll=${lat},${lng}&q=${encodeURIComponent('展示牌位置')}`:'';if(navigator.share){try{return await navigator.share({title:'展示牌安装位置',text:t,url})}catch(e){if(e.name==='AbortError')return}}await navigator.clipboard.writeText(t+(url?'\n'+url:''));alert('位置信息已复制，可直接粘贴到微信发送。')}
function navPlace(id,type){let p=data.find(x=>x.id===id);if(!p.lat||!p.lng)return alert('这个地点还没有坐标');type==='apple'?window.open(`https://maps.apple.com/?daddr=${p.lat},${p.lng}&q=${encodeURIComponent(p.name)}`,'_blank'):window.open(`https://api.map.baidu.com/marker?location=${p.lat},${p.lng}&title=${encodeURIComponent(p.name)}&content=${encodeURIComponent(p.note||'展示牌位置')}&output=html`,'_blank')}function openApple(){if(!plat.value||!plng.value)return alert('请先获取位置');window.open(`https://maps.apple.com/?daddr=${plat.value},${plng.value}&q=${encodeURIComponent(pname.value||'展示牌位置')}`,'_blank')}function openBaidu(){if(!plat.value||!plng.value)return alert('请先获取位置');window.open(`https://api.map.baidu.com/marker?location=${plat.value},${plng.value}&title=${encodeURIComponent(pname.value||'展示牌位置')}&output=html`,'_blank')}
function addPhotos(e){[...e.target.files].forEach(f=>{let r=new FileReader;r.onload=()=>{tempPhotos.push(r.result);renderEditPhotos()};r.readAsDataURL(f)});e.target.value=''}function fontSize(d){noteFont=Math.max(12,Math.min(30,noteFont+d));localStorage.setItem(KF,noteFont);fontVal.textContent=noteFont;if(modal.classList.contains('show'))pnote.style.fontSize=noteFont+'px'}
function exportBackup(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),noteFont,data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`展示牌位置备份_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let o=JSON.parse(r.result);if(!Array.isArray(o.data))throw 0;if(!confirm(`将导入 ${o.data.length} 个地点并覆盖当前本机数据，继续吗？`))return;data=o.data;noteFont=o.noteFont||16;localStorage.setItem(KF,noteFont);saveLocal();alert('导入完成')}catch{alert('备份文件格式不正确')}};r.readAsText(f);e.target.value=''}
// Supabase REST/Auth：云端按“一个地点一行”保存；照片永远不上传云端。
function saveSession(){if(session)localStorage.setItem('sign_cloud_session',JSON.stringify(session));else localStorage.removeItem('sign_cloud_session')}
async function cloudLogin(){
  const email=document.getElementById('cloudEmail').value.trim(), password=document.getElementById('cloudPass').value;
  if(!email||!password)return alert('请输入邮箱和密码');
  setSync('正在登录…');
  try{
    const res=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const obj=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(obj.error_description||obj.msg||obj.message||'登录失败');
    session=obj; saveSession(); showSession(); await syncDownThenUp();
  }catch(e){ setSync('未登录'); alert('登录失败：'+e.message+'\n\n如果这是第一次使用，请先点“注册”。'); }
}
async function cloudRegister(){
  const email=document.getElementById('cloudEmail').value.trim(), password=document.getElementById('cloudPass').value;
  if(!email||!password)return alert('请输入邮箱和密码');
  if(password.length<6)return alert('密码至少需要 6 位');
  setSync('正在注册…');
  try{
    const r=await fetch(`${SUPABASE_URL}/auth/v1/signup`,{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const obj=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(obj.error_description||obj.msg||obj.message||'注册失败');
    if(obj.access_token){session=obj;saveSession();showSession();await syncDownThenUp();alert('注册并登录成功');}
    else{showSession();alert('注册成功。请到邮箱完成确认，然后回来点“登录”。');}
  }catch(e){setSync('未登录');alert('注册失败：'+e.message)}
}
function setSync(t){const el=document.getElementById('syncText');if(el)el.textContent=t}
function showSession(){
  const login=document.getElementById('loginBox'), logged=document.getElementById('loggedBox'), whoEl=document.getElementById('who');
  const ok=!!(session&&session.access_token&&session.user);
  login.style.display=ok?'none':'block';
  logged.style.display=ok?'block':'none';
  login.classList.toggle('hidden',ok); logged.classList.toggle('hidden',!ok);
  if(ok&&whoEl)whoEl.textContent=session.user.email||'云账号';
}
async function logout(){
  try{if(session?.access_token)await fetch(`${SUPABASE_URL}/auth/v1/logout`,{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${session.access_token}`}})}catch{}
  session=null;saveSession();showSession();document.getElementById('cloudPass').value='';
}
async function ensureSession(){
  if(!session?.access_token)return false;
  let exp=session.expires_at?session.expires_at*1000:0;
  if(!exp||Date.now()<exp-60000)return true;
  if(!session.refresh_token)return false;
  let r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
  if(!r.ok){logout();return false}
  session=await r.json();saveSession();showSession();return true;
}
function cloudRows(){return data.map((p,i)=>({id:p.id,user_id:session.user.id,fixed_no:+p.no||i+1,place_name:p.name||'',latitude:p.lat===''||p.lat==null?null:+p.lat,longitude:p.lng===''||p.lng==null?null:+p.lng,remark:p.note||'',remark_font_size:noteFont,sort_order:i,updated_at:new Date().toISOString()}))}
let syncTimer;
function queueCloud(){if(!session?.access_token)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncUp,700)}
async function syncUp(){
  try{
    if(!await ensureSession())return;
    $('syncText').textContent='正在上传…';
    let h={apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'};
    let del=await fetch(`${SUPABASE_URL}/rest/v1/sign_locations?user_id=eq.${encodeURIComponent(session.user.id)}`,{method:'DELETE',headers:h});
    if(!del.ok)throw Error(await del.text());
    let rows=cloudRows();
    if(rows.length){let r=await fetch(`${SUPABASE_URL}/rest/v1/sign_locations`,{method:'POST',headers:{...h,Prefer:'return=minimal'},body:JSON.stringify(rows)});if(!r.ok)throw Error(await r.text())}
    $('syncText').textContent='云端已同步 '+new Date().toLocaleTimeString();
  }catch(e){$('syncText').textContent='云同步失败：'+e.message}
}
async function syncDownThenUp(){
  try{
    if(!await ensureSession())return;
    $('syncText').textContent='正在同步…';
    let r=await fetch(`${SUPABASE_URL}/rest/v1/sign_locations?user_id=eq.${encodeURIComponent(session.user.id)}&select=id,fixed_no,place_name,latitude,longitude,remark,remark_font_size,sort_order,updated_at&order=sort_order.asc`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${session.access_token}`}});
    if(!r.ok)throw Error(await r.text());
    let rows=await r.json();
    if(rows.length){
      let localById=Object.fromEntries(data.map(x=>[x.id,x]));
      data=rows.map(x=>({id:x.id,no:x.fixed_no,name:x.place_name||'',lat:x.latitude==null?'':String(x.latitude),lng:x.longitude==null?'':String(x.longitude),note:x.remark||'',photos:localById[x.id]?.photos||[]}));
      if(rows[0].remark_font_size){noteFont=+rows[0].remark_font_size;localStorage.setItem(KF,noteFont)}
      localStorage.setItem(K,JSON.stringify(data));render();
    }else if(data.length){await syncUp();return}
    $('syncText').textContent='云端已同步 '+new Date().toLocaleTimeString();
  }catch(e){$('syncText').textContent='同步失败：'+e.message}
}
try{session=JSON.parse(localStorage.getItem('sign_cloud_session')||'null')}catch{}
showSession();render();
if(session?.access_token)setTimeout(syncDownThenUp,200);
</script></body></html>
